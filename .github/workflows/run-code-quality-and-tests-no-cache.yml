name: Code Quality & Tests Without Cache

on:
  workflow_call:
    inputs:
      use_das_cli:
        description: Use the published das-cli loader and attention broker
        type: boolean
        required: false
        default: false
    outputs:
      failed_job:
        description: Name of the job that failed, if any
        value: ${{ jobs.report.outputs.failed_job }}

  workflow_dispatch:
    inputs:
      use_das_cli:
        description: Use the published das-cli loader and attention broker
        type: boolean
        required: false
        default: false

jobs:
  format-check:
    uses: ./.github/workflows/run-format-check-no-cache.yml

  unit-tests:
    needs: format-check
    uses: ./.github/workflows/run-unit-tests-no-cache.yml
    with:
      use_das_cli: ${{ inputs.use_das_cli == true || inputs.use_das_cli == 'true' }}

  report:
    needs: [format-check, unit-tests]
    if: always()
    runs-on: self-hosted
    outputs:
      failed_job: ${{ steps.failed-job.outputs.name }}
    steps:
      - name: Determine failed job
        id: failed-job
        run: |
          if [ "${{ needs.format-check.result }}" = "failure" ]; then
            echo "name=format-check" >> "$GITHUB_OUTPUT"
          elif [ "${{ needs.unit-tests.result }}" = "failure" ]; then
            echo "name=unit-tests" >> "$GITHUB_OUTPUT"
          else
            echo "name=" >> "$GITHUB_OUTPUT"
          fi
